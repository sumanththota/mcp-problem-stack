[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP security gateway proxy: role-based tool-call authorization in front of a downstream MCP server."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pydantic>=2.13",
]

[project.scripts]
mcp-gateway = "mcp_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
