[project]
name = "llm-gateway"
version = "0.1.0"
description = "LLM gateway streaming guardrail: redacts PII from a streamed LLM response, including patterns split across chunk boundaries."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "pydantic>=2.13",
    "python-dotenv>=1.0",
]

[project.scripts]
llm-gateway = "llm_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
